<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AMS Design | Miniature Scale Calculator</title><style>:root{font-family:system-ui,Segoe UI,Arial,sans-serif;color:#292338;background:#f7f3fa}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:620px;margin:32px auto;background:white;padding:30px;border-radius:22px;box-shadow:0 12px 36px #372b4820}h1{margin:0;font-size:26px}p{color:#625a6c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:14px;font-weight:650;margin:17px 0 7px}input,select{width:100%;border:1px solid #d5cfdd;border-radius:10px;padding:12px;font-size:17px;background:white}output{display:block;font-size:31px;font-weight:800;color:#7142a1;margin:8px 0}.result{background:#f1eaf8;padding:20px;border-radius:14px;margin-top:24px}.muted{font-size:13px}button{padding:11px 15px;border:0;border-radius:10px;background:#7142a1;color:white;cursor:pointer;font-weight:650}footer{font-size:12px;text-align:center;color:#756b7c;margin-top:24px}@media(max-width:450px){.grid{grid-template-columns:1fr}.wrap{padding:22px}}</style></head><body><main class="wrap"><h1>Miniature Scale Calculator</h1><p>By <b>AMS Design</b> · Convert real-world dimensions into miniature sizes, or back again.</p><div class="grid"><div><label for="size">Measurement</label><input id="size" type="number" min="0" step="any" value="120"></div><div><label for="unit">Unit</label><select id="unit"><option value="mm">Millimeters (mm)</option><option value="cm" selected>Centimeters (cm)</option><option value="in">Inches (in)</option><option value="ft">Feet (ft)</option><option value="m">Meters (m)</option></select></div><div><label for="scale">Miniature scale</label><select id="scale"><option value="6">1:6</option><option value="12" selected>1:12</option><option value="16">1:16</option><option value="18">1:18</option><option value="24">1:24</option><option value="48">1:48</option><option value="72">1:72</option><option value="87">1:87</option></select></div><div><label for="direction">Conversion</label><select id="direction"><option value="down">Real size → miniature</option><option value="up">Miniature → real size</option></select></div></div><div class="result"><div id="caption">Miniature size</div><output id="result">10 cm</output><div id="extra" class="muted">100 mm · 3.937 in</div><button id="copy" type="button">Copy result</button></div><p class="muted">Calculated mathematically. Printed parts may require additional allowance for printer tolerances.</p><footer>© AMS Design · Miniature Scale Calculator</footer></main><script>const $=id=>document.getElementById(id),f=n=>Number.isFinite(n)?Number(n.toFixed(4)).toLocaleString('en-US',{maximumFractionDigits:4}):'—';function calc(){let n=Number($('size').value),s=Number($('scale').value),up=$('direction').value==='up',unit=$('unit').value;const mm={mm:1,cm:10,in:25.4,ft:304.8,m:1000};if($('size').value===''||!Number.isFinite(n)||n<0){$('result').textContent='Enter a valid size';$('extra').textContent='';return}let resultMM=n*mm[unit]*(up?s:1/s),result=resultMM/mm[unit];$('caption').textContent=up?'Real-world size':'Miniature size';$('result').textContent=f(result)+' '+unit;$('extra').textContent=f(resultMM)+' mm · '+f(resultMM/25.4)+' in'}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',calc));$('copy').addEventListener('click',()=>{let val=$('result').textContent;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(val).then(()=>{$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy result',1200)}).catch(()=>prompt('Copy result:',val));else prompt('Copy result:',val)});calc();</script></body></html>
